[package]
name = "reminder-mailroom"
version = "0.1.0"
description = "Keep one canonical invoice while sending normal reminders"
authors = ["Sociobot"]
license = "MIT"
edition = "2021"

[lib]
name = "reminder_mailroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "reminder-mailroom"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:chrono", "dep:dirs", "dep:hex", "dep:imap", "dep:keyring", "dep:lettre", "dep:native-tls", "dep:rusqlite", "dep:sha2", "dep:uuid"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"], optional = true }
dirs = { version = "6", optional = true }
hex = { version = "0.4", optional = true }
imap = { version = "2.4", optional = true }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"], optional = true }
mailparse = "0.16"
native-tls = { version = "0.2", optional = true }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
sha2 = { version = "0.10", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
